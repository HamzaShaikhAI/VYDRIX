name: CI

on:
  push:
    branches: [main, vydrix-main, feature/cloud-first-computing]
    tags: ['v*']
  pull_request:
    branches: [main, vydrix-main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore Vydrix.slnx
      - name: Build Release
        run: dotnet build Vydrix.slnx -c Release --no-restore --nologo
      # Unit tests only: integration tests mount real virtual drives and require WinFsp + rclone runtime.
      - name: Run unit tests
        run: dotnet test tests/Vydrix.Tests/Vydrix.Tests.csproj -c Release --no-build --nologo
